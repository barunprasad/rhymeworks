# Your characters, props and places (paths relative to this assets/ folder). Add them from the studio's Library
# ("New character / prop / scene") or by hand.
# In episode prompts write {id} (e.g. {asha}, {bus}); the engine expands it to `ref` + "(second image)" etc. and
# attaches the image. `style` is added to the keyframe prompt whenever the character is in the shot; `alone` when
# they are the only person in it. person = counts as a human. A prop's `keep` text goes into a clip prompt with {keep:id}.
#
# [cast.asha]
# file = "cast/asha.png"
# ref = "the girl in the yellow frock"
# style = "The girl in the yellow frock has two short braids."
# person = true

# ---------- cast ----------
[cast]

# The example cast (episodes/little-red-kite). Keep them, change them, or delete them.
[cast.tara]
file = "cast/tara.jpg"
ref = "the little girl in the yellow raincoat"
style = "The girl in the yellow raincoat has curly black hair in two puffs and little red boots."
person = true

[cast.biscuit]
file = "cast/biscuit.jpg"
ref = "the fluffy brown puppy with the blue collar"
style = "The puppy keeps its floppy ears, white chest patch and blue collar."

# ---------- props ----------
[props]

[props.red_kite]
file = "props/red_kite.jpg"
ref = "the red diamond kite with the tail of blue bows"
keep = "The kite keeps its exact red diamond shape and its single tail of little blue bows"

# ---------- scenes (always the first image of a keyframe) ----------
[scenes]
kite_hill = "scenes/kite_hill.jpg"
